{% extends 'monitoring/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3 border-bottom-0">
                <h4 class="mb-0 text-center fw-bold">Add Location</h4>
            </div>
            <div class="card-body px-4 pb-4">
                {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="device" class="form-label fw-medium">Select Device</label>
                        <select name="device" id="device" class="form-select bg-light" required>
                            <option value="">Select a device...</option>
                            {% for device in devices %}
                                <option value="{{ device.mac_address }}">{{ device.mac_address }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="building" class="form-label fw-medium">Building</label>
                        <input type="text" class="form-control bg-light" id="building" name="building" placeholder="e.g.: Block A" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="floor" class="form-label fw-medium">Floor</label>
                        <input type="text" class="form-control bg-light" id="floor" name="floor" placeholder="e.g.: 2" required>
                    </div>

                    <div class="mb-4">
                        <label for="room" class="form-label fw-medium">Room</label>
                        <input type="text" class="form-control bg-light" id="room" name="room" placeholder="e.g.: 201" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-2 fw-medium">Save Location</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
